server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers — align with blueprint §5.6.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  # HSTS is applied at Azure Front Door in production; local development
  # doesn't need it and browser TLS-locking on localhost is disruptive.

  # SPA fallback — every unknown path serves index.html so React Router
  # can handle client-side routing.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse-proxy /api to the sidecar API service. In Azure Container Apps
  # the API is a separate app in the same environment; DNS name comes from
  # the API_HOST env var injected at revision time.
  location /api/ {
    proxy_pass ${API_URL}/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Long-lived caching for hashed assets emitted by Vite.
  location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
