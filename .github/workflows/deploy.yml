name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'db/**'
      - 'packages/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'

concurrency:
  # Serialize deploys per environment — never race two deploys against the same RG.
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  AZURE_RG: ${{ vars.AZURE_RG }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  LOCATION: ${{ vars.AZURE_LOCATION }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      # Azure login with OIDC federation — no long-lived client secrets.
      id-token: write
      contents: read
    outputs:
      api_tag: ${{ steps.tags.outputs.api_tag }}
      web_tag: ${{ steps.tags.outputs.web_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tags
        id: tags
        run: |
          echo "api_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "web_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/vsa-api:${{ steps.tags.outputs.api_tag }}
            ${{ env.ACR_NAME }}.azurecr.io/vsa-api:latest
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/vsa-api:buildcache
          cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/vsa-api:buildcache,mode=max

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/vsa-web:${{ steps.tags.outputs.web_tag }}
            ${{ env.ACR_NAME }}.azurecr.io/vsa-web:latest
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/vsa-web:buildcache
          cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/vsa-web:buildcache,mode=max

  deploy-infra:
    name: Deploy Bicep
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep deploy
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          JWT_DEV_SECRET: ${{ secrets.JWT_DEV_SECRET }}
          VENDOR_TOKEN_PEPPER: ${{ secrets.VENDOR_TOKEN_PEPPER }}
          API_IMAGE_TAG: ${{ needs.build-and-push.outputs.api_tag }}
          WEB_IMAGE_TAG: ${{ needs.build-and-push.outputs.web_tag }}
        run: |
          az deployment group create \
            --resource-group "$AZURE_RG" \
            --template-file infra/main.bicep \
            --parameters infra/params/${ENVIRONMENT}.bicepparam \
            --name vsa-${ENVIRONMENT}-$(date -u +%Y%m%d-%H%M%S)

  migrate:
    name: Run DB migrations
    needs: deploy-infra
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch DATABASE_URL from Key Vault
        id: kv
        run: |
          KV_NAME=$(az deployment group show \
            --resource-group "$AZURE_RG" \
            --name $(az deployment group list --resource-group "$AZURE_RG" \
                     --query "[?contains(name, 'vsa-${ENVIRONMENT}')].name | [0]" -o tsv) \
            --query properties.outputs.keyVaultName.value -o tsv)
          DB_URL=$(az keyvault secret show --vault-name "$KV_NAME" --name database-url --query value -o tsv)
          echo "::add-mask::$DB_URL"
          echo "database_url=$DB_URL" >> "$GITHUB_OUTPUT"

      - name: Apply Prisma migrations + post-migrate SQL
        env:
          DATABASE_URL: ${{ steps.kv.outputs.database_url }}
        run: |
          npm run db:generate
          npm run db:migrate:deploy
